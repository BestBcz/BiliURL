name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and verify both plugin packages
        run: |
          chmod +x ./gradlew
          ./gradlew clean verifyReleaseArtifacts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: build/release/*.jar
          if-no-files-found: error
